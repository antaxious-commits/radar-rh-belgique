name: Publier le site

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:   # weekly.yml calls this after committing (pushes by GITHUB_TOKEN don't trigger workflows)

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Regenerates site/index.html and copies the PDFs into site/briefings/ (stdlib only).
      - run: python site/build_site.py
      - name: Assemble site
        run: |
          mkdir -p _site
          cp site/index.html site/manifest.webmanifest site/*.png _site/
          cp site/*.ics _site/ 2>/dev/null || true
          cp -r site/briefings _site/ 2>/dev/null || true
          cp -r site/reports _site/ 2>/dev/null || true
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
